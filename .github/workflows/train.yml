name: ZIKA-AI Train Nano

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Numero total de passos de treino"
        required: true
        type: number
        default: 1000
      batch_size:
        description: "Sequencias por passo"
        required: true
        type: number
        default: 1
      sequence_length:
        description: "Tokens por sequencia (maximo 256)"
        required: true
        type: number
        default: 128
      seed:
        description: "Semente de inicializacao"
        required: true
        type: number
        default: 1337
      validation_ratio:
        description: "Fracao de conversas para validacao"
        required: true
        type: string
        default: "0.10"
      test_ratio:
        description: "Fracao de conversas para teste final"
        required: true
        type: string
        default: "0.10"
      eval_every:
        description: "Intervalo de avaliacao amostrada"
        required: true
        type: number
        default: 100
      eval_tokens:
        description: "Tokens maximos por avaliacao amostrada"
        required: true
        type: number
        default: 2048
      full_eval_every:
        description: "Intervalo de avaliacao completa (0 desativa)"
        required: true
        type: number
        default: 500
      max_steps_this_run:
        description: "Passos executados nesta execucao (0 executa ate ao total)"
        required: true
        type: number
        default: 0
      resume_run_id:
        description: "ID de uma execucao anterior para retomar (opcional)"
        required: false
        type: string
        default: ""
      resume_legacy_total_steps:
        description: "Total original de passos para checkpoint antigo ZCKP v1 (0 se nao aplicavel)"
        required: false
        type: number
        default: 0

permissions:
  contents: read
  actions: read

jobs:
  train-nano:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 2
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4

      - name: Configure C++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZIKA_NATIVE=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare train, validation and held-out test sets
        run: |
          python -m zika.data \
            --input data/dialogos.jsonl data/dialogos_extra.jsonl \
            --output-dir "$RUNNER_TEMP/zika-data" \
            --validation-ratio "${{ inputs.validation_ratio }}" \
            --test-ratio "${{ inputs.test_ratio }}"

      - name: Restore previous checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: zika-nano-training
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resume

      - name: Train ZIKA-Nano
        env:
          STEPS: ${{ inputs.steps }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SEQUENCE_LENGTH: ${{ inputs.sequence_length }}
          SEED: ${{ inputs.seed }}
          MAX_STEPS_THIS_RUN: ${{ inputs.max_steps_this_run }}
          EVAL_EVERY: ${{ inputs.eval_every }}
          EVAL_TOKENS: ${{ inputs.eval_tokens }}
          FULL_EVAL_EVERY: ${{ inputs.full_eval_every }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_LEGACY_TOTAL_STEPS: ${{ inputs.resume_legacy_total_steps }}
        run: |
          set -euo pipefail
          mkdir -p output
          WARMUP=$((STEPS / 10))
          if [ "$WARMUP" -ge "$STEPS" ]; then WARMUP=0; fi
          ARGS=(
            --config configs/nano.json
            --data "$RUNNER_TEMP/zika-data/train.bin"
            --val-data "$RUNNER_TEMP/zika-data/val.bin"
            --out output/zika-nano.zika
            --checkpoint output/zika-nano.ckpt
            --steps "$STEPS"
            --max-steps-this-run "$MAX_STEPS_THIS_RUN"
            --batch-size "$BATCH_SIZE"
            --seq-len "$SEQUENCE_LENGTH"
            --warmup-steps "$WARMUP"
            --seed "$SEED"
            --log-every 25
            --eval-every "$EVAL_EVERY"
            --eval-tokens "$EVAL_TOKENS"
            --full-eval-every "$FULL_EVAL_EVERY"
            --checkpoint-every 100
            --resume-legacy-total-steps "$RESUME_LEGACY_TOTAL_STEPS"
          )
          if [ -n "$RESUME_RUN_ID" ]; then
            CHECKPOINT="$RUNNER_TEMP/resume/zika-nano.ckpt"
            test -s "$CHECKPOINT"
            ARGS+=(--resume "$CHECKPOINT")
          fi
          ./build/zika train "${ARGS[@]}" 2>&1 | tee output/training.log
          ./build/zika info output/zika-nano.zika | tee output/model-info.txt
          if [ "$MAX_STEPS_THIS_RUN" -eq 0 ]; then
            ./build/zika eval \\
              --model output/zika-nano.zika \\
              --data "$RUNNER_TEMP/zika-data/test.bin" \\
              --seq-len "$SEQUENCE_LENGTH" \\
              | tee output/held-out-test-evaluation.txt
            printf 'O que e uma variavel?\nComo posso estudar melhor?\n/sair\n' | \
              ./build/zika chat --model output/zika-nano.zika \
                --max-new-tokens 96 --temperature 0.8 --top-k 40 --top-p 0.9 --seed 2026 \
              | tee output/qualitative-samples.txt
          else
            echo "Execucao parcial: avaliacao held-out adiada ate ao ultimo segmento."
          fi
          cp "$RUNNER_TEMP/zika-data/manifest.json" output/dataset-manifest.json

      - name: Add training summary
        if: always()
        run: |
          if [ -f output/training.log ]; then
            echo "## ZIKA-Nano training" >> "$GITHUB_STEP_SUMMARY"
            grep -E 'Inicio:|step [0-9]+/|eval step|Fim:' output/training.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          if [ -f output/held-out-test-evaluation.txt ]; then
            echo "## Held-out test" >> "$GITHUB_STEP_SUMMARY"
            cat output/held-out-test-evaluation.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload model, checkpoint and evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zika-nano-training
          path: output/
          if-no-files-found: warn
          retention-days: 14
