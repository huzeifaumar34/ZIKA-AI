name: ZIKA-AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZIKA_NATIVE=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: |
          ./build/zika version
          ./build/zika init --config configs/nano.json --out /tmp/zika-nano.zika
          ./build/zika info /tmp/zika-nano.zika
